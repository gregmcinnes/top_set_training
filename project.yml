name: SBS
options:
  minimumXcodeGenVersion: 2.36.0
  createIntermediateGroups: true
  bundleIdPrefix: com.gregorymcinnes
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    # Single source of truth for the app version. Bump HERE, not in Xcode:
    # the pbxproj is regenerated from this file, so a version set only in
    # Xcode is silently reverted by the next `xcodegen generate`.
    CURRENT_PROJECT_VERSION: 15
    MARKETING_VERSION: "1.5"
packages: {}
targets:
  SBSApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SBSApp
      - path: SBSCore
      # Colour tokens, shared with the widget and the Watch (one source for the hex values)
      - path: Shared/Tokens.xcassets
      # Bundle the whole Resources directory: itemizing files here silently
      # drops any JSON added later (xcodegen regenerates the project from this
      # list alone), which strands users on the StrongLifts fallback at launch.
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: RestTimerWidget
        embed: true
      - target: SBSWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gregorymcinnes.topsettraining
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2K7MV7G4ZJ
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
    scheme:
      storeKitConfiguration: SBS.storekit
      testTargets:
        - SBSTests
    entitlements:
      path: SBSApp/SBSApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: SBSApp/Info.plist
      properties:
        CFBundleName: Top Set Training
        CFBundleDisplayName: Top Set Training
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        # Bundled from Resources/Fonts (flattened into the bundle root). OFL licences sit beside them.
        UIAppFonts:
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - Archivo-Medium.ttf
          - Archivo-Regular.ttf
          - Archivo-SemiBold.ttf
          - ArchivoSemiCondensed-Bold.ttf
          - ArchivoSemiExpanded-Black.ttf
          - BarlowCondensed-Bold.ttf
          - IBMPlexMono-Bold.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        # Portrait-only on iPad needs this, or upload validation rejects the build
        # for not supporting all iPad orientations (ITMS-90474).
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSHealthShareUsageDescription: Top Set Training reads your body weight from HealthKit to estimate calories burned and calculate your strength scores.
        NSHealthUpdateUsageDescription: Top Set Training uses HealthKit to automatically log your strength training workouts to Apple Fitness, tracking duration and workout completion.

  RestTimerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RestTimerWidget
      - path: SBSCore/RestTimerActivity.swift
      - path: Shared/Tokens.xcassets
      # The three faces the Live Activity uses (timer numeral, eyebrow, exercise name).
      - path: Resources/Fonts/BarlowCondensed-Bold.ttf
        buildPhase: resources
      - path: Resources/Fonts/ArchivoSemiCondensed-Bold.ttf
        buildPhase: resources
      - path: Resources/Fonts/Archivo-Bold.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gregorymcinnes.topsettraining.RestTimerWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RestTimerWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Rest Timer
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2K7MV7G4ZJ
    info:
      path: RestTimerWidget/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
        UIAppFonts:
          - BarlowCondensed-Bold.ttf
          - ArchivoSemiCondensed-Bold.ttf
          - Archivo-Bold.ttf

  SBSWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: SBSWatch
      - path: SBSCore/HealthKitManager.swift
      - path: SBSCore/Logger.swift
      # Not Shared/Tokens.xcassets: actool drops dark appearances for watchOS, so the
      # Watch gets the Iron values generated by scripts/make_watch_tokens.py
      # (SBSWatch/WatchTokens.xcassets, inside the SBSWatch source folder).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gregorymcinnes.topsettraining.watchkitapp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2K7MV7G4ZJ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.gregorymcinnes.topsettraining
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: false
    entitlements:
      path: SBSWatch/SBSWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: SBSWatch/Info.plist
      properties:
        CFBundleName: Top Set Training
        CFBundleDisplayName: Top Set Training
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.gregorymcinnes.topsettraining
        # Keeps the app running through the wrist-down rest periods of a workout.
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Top Set Training uses HealthKit to track your heart rate during workouts.
        NSHealthUpdateUsageDescription: Top Set Training uses HealthKit to automatically log your strength training workouts.

  SBSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SBSTests
      - path: SBSCore
    dependencies:
      - target: SBSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gregorymcinnes.topsettraining.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SBSApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SBSApp
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2K7MV7G4ZJ
        GENERATE_INFOPLIST_FILE: YES

  SBSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SBSUITests
    dependencies:
      - target: SBSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gregorymcinnes.topsettraining.uitests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2K7MV7G4ZJ
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Separate from SBSApp so the regular test command stays fast and doesn't log sets on
  # the simulator it runs on. A target skipped in SBSApp can't be run with -only-testing.
  # scripts/ui_walkthrough.sh runs this.
  SBSWalkthrough:
    build:
      targets:
        SBSApp: all
        SBSUITests: [test]
    test:
      config: Debug
      targets:
        - SBSUITests
